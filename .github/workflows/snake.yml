
name: Generate Obsidian Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate silver and amber snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=F59E0B&color_dots=%23080D16,%23374151,%2378716C,%23B45309,%23FBBF24
            dist/github-snake-dark.svg?color_snake=D6D3D1&color_dots=%23080D16,%231F2937,%234B5563,%239CA3AF,%23F59E0B

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
