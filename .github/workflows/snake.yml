
name: Generate Neon Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate cyan and violet snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=22D3EE&color_dots=%230B1120,%23164E63,%230891B2,%2306B6D4,%23A78BFA
            dist/github-snake-dark.svg?color_snake=A78BFA&color_dots=%230B1120,%231E1B4B,%234C1D95,%237C3AED,%23C4B5FD

      - name: Publish generated SVG files
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
