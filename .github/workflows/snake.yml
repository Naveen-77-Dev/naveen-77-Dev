name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # manual run from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Light theme: white empty cells, indigo-to-violet contributions, pink snake
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ec4899&color_dots=#ffffff,#c7d2fe,#a5b4fc,#818cf8,#4f46e5

      # Add a soft lavender rounded panel behind the board so the white dots stay visible
      - name: Add light background panel
        run: |
          perl -0pi -e 's/(<svg[^>]*>)/$1<rect width="100%" height="100%" rx="14" fill="#e0e7ff"\/>/' dist/github-snake.svg

      - name: Push SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
