<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Naveen Mangali — AI and Machine Learning" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <style>
      .name { font: 700 58px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: 3px; }
      .sub  { font: 500 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; opacity: 0.92; letter-spacing: 1px; }
      .t    { font: 500 18px 'Courier New', Consolas, monospace; fill: #ffffff; opacity: 0; }
      @keyframes cyc { 0% {opacity:0} 5% {opacity:1} 30% {opacity:1} 35% {opacity:0} 100% {opacity:0} }
      .t1 { animation: cyc 9s infinite; }
      .t2 { animation: cyc 9s infinite; animation-delay: 3s; }
      .t3 { animation: cyc 9s infinite; animation-delay: 6s; }
      @keyframes float { 0%,100% {transform: translateY(0)} 50% {transform: translateY(-12px)} }
      .c1 { animation: float 6s ease-in-out infinite; }
      .c2 { animation: float 8s ease-in-out infinite; animation-delay: 1s; }
      .c3 { animation: float 7s ease-in-out infinite; animation-delay: 2s; }
    </style>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <circle class="c1" cx="140" cy="70" r="70" fill="#ffffff" opacity="0.10"/>
  <circle class="c2" cx="1060" cy="190" r="90" fill="#ffffff" opacity="0.10"/>
  <circle class="c3" cx="930" cy="50" r="38" fill="#ffffff" opacity="0.12"/>
  <circle class="c3" cx="300" cy="215" r="28" fill="#ffffff" opacity="0.12"/>
  <text class="name" x="600" y="105" text-anchor="middle">NAVEEN MANGALI</text>
  <text class="sub" x="600" y="148" text-anchor="middle">AI &amp; Machine Learning · Generative AI · LLM Applications</text>
  <text class="t t1" x="600" y="205" text-anchor="middle">&gt; Building intelligent software people can use</text>
  <text class="t t2" x="600" y="205" text-anchor="middle">&gt; B.Tech CSE · AI &amp; Machine Learning · MRCET</text>
  <text class="t t3" x="600" y="205" text-anchor="middle">&gt; Turning ideas into working products</text>
</svg>
